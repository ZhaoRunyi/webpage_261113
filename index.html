<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>SELA-TTT: Rebuttal Videos</title>
  <style>
    body { margin: 0; background: white; color: #222; font: 16px/1.5 Arial, sans-serif; }
    main { max-width: 1440px; margin: 0 auto; padding: 28px 24px 64px; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    h2 { font-size: 22px; margin: 40px 0 20px; padding-top: 16px; border-top: 1px solid #ddd; }
    h3 { font-size: 18px; margin: 28px 0 14px; }
    .videos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    figure { margin: 0; min-width: 0; }
    video { display: block; width: 100%; aspect-ratio: 4/3; background: #f3f3f3; }
    figcaption { margin: 12px auto 0; max-width: 64ch; text-align: center; font-size: 15px; line-height: 1.5; color: #444; }
    figcaption strong { display: block; color: #222; }
    .demonstration { max-width: 708px; margin-bottom: 24px; }
    .annotation-comparison { max-width: 1280px; margin: 0 auto; }
    .annotation-comparison video { aspect-ratio: 8/3; }
    @media (max-width: 1240px) { .three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 850px) { .videos, .three { grid-template-columns: 1fr; } }
    @media (max-width: 480px) { main { padding-right: 16px; padding-left: 16px; } }
  </style>
</head>
<body>
<main>
  <h1>SELA-TTT: Rebuttal Videos</h1>

  <section id="semantic-input">
    <h2>Reviewers tZUt and QwRG</h2>
    <h3>Direct semantic input</h3>
    <div class="videos">
      <figure><video controls playsinline preload="none" poster="posters/token-chemistry.jpg?v=bright1" src="videos/token-chemistry.mp4?v=bright1" aria-label="Semantic-token baseline on Chemistry"></video><figcaption><strong>Semantic-token baseline</strong></figcaption></figure>
      <figure><video controls playsinline preload="none" poster="posters/sela-chemistry.jpg?v=bright1" src="videos/sela-chemistry.mp4?v=bright1" aria-label="SELA-TTT on Chemistry"></video><figcaption><strong>SELA-TTT</strong></figcaption></figure>
    </div>
  </section>

  <section id="annotation-comparison">
    <h2>Reviewers tZUt and QwRG</h2>
    <h3>Human and evaluator annotations</h3>
    <figure class="annotation-comparison"><video controls playsinline preload="none" poster="posters/human-evaluator-annotations.jpg?v=bright1" src="videos/human-evaluator-annotations.mp4?v=bright1" aria-label="Human and evaluator annotations on the same rollout"></video><figcaption><strong>Human annotations (left) and evaluator annotations (right)</strong></figcaption></figure>
  </section>

  <section id="icl">
    <h2>Reviewer Puxm</h2>
    <h3>Semantic-aware in-context learning</h3>
    <figure class="demonstration"><video controls playsinline preload="none" poster="posters/human-demonstration.jpg?v=bright1" src="videos/human-demonstration.mp4?v=bright1" aria-label="Imperfect human demonstration"></video><figcaption><strong>Imperfect human demonstration</strong></figcaption></figure>
    <div class="videos three">
      <figure><video controls playsinline preload="none" poster="posters/input-icl.jpg?v=bright1" src="videos/input-icl.mp4?v=bright1" aria-label="Input-feature modulation on Chemistry ICL"></video><figcaption><strong>Input-feature modulation</strong></figcaption></figure>
      <figure><video controls playsinline preload="none" poster="posters/raw-qkv-icl.jpg?v=bright1" src="videos/raw-qkv-icl.mp4?v=bright1" aria-label="Raw-QKV modulation on Chemistry ICL"></video><figcaption><strong>Raw-QKV modulation</strong></figcaption></figure>
      <figure><video controls playsinline preload="none" poster="posters/sela-icl.jpg?v=bright1" src="videos/sela-icl.mp4?v=bright1" aria-label="SELA-TTT on Chemistry ICL"></video><figcaption><strong>SELA-TTT</strong></figcaption></figure>
    </div>
  </section>

  <section id="switching">
    <h2>Reviewer Puxm</h2>
    <h3>Unseen switching</h3>
    <div class="videos three">
      <figure><video controls playsinline preload="none" poster="posters/input-switching.jpg?v=bright1" src="videos/input-switching.mp4?v=bright1" aria-label="Input-feature modulation on unseen switching"></video><figcaption><strong>Input-feature modulation</strong></figcaption></figure>
      <figure><video controls playsinline preload="none" poster="posters/raw-qkv-switching.jpg?v=bright1" src="videos/raw-qkv-switching.mp4?v=bright1" aria-label="Raw-QKV modulation on unseen switching"></video><figcaption><strong>Raw-QKV modulation</strong></figcaption></figure>
      <figure><video controls playsinline preload="none" poster="posters/sela-switching.jpg?v=bright1" src="videos/sela-switching.mp4?v=bright1" aria-label="SELA-TTT on unseen switching"></video><figcaption><strong>SELA-TTT</strong></figcaption></figure>
    </div>
  </section>
</main>
</body>
</html>
